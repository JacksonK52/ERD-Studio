server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx quirk: add_header does NOT inherit into a location block that
    # defines its own add_header — so these three are deliberately
    # repeated in every location below that also sets Cache-Control,
    # rather than relying on inheritance from here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Container health check target (masterplan §22 Phase 8 — "Container
    # health behavior"). Distinct from "/" so it stays cheap and doesn't
    # depend on the SPA's index.html being served correctly to be useful
    # as a liveness signal.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets (the Vite output filenames include a content
    # hash) — safe to cache aggressively and immutably; a changed file
    # gets a new filename, not a new version of the same URL.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the one file that must never be cached — it's what
    # references the current hashed asset filenames, so a stale cached
    # copy would point at assets that may no longer exist after a
    # redeploy.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: any other path falls through to index.html rather
    # than a raw 404. This app has no client-side router today, but it's
    # a harmless, standard default that avoids surprises if that changes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
